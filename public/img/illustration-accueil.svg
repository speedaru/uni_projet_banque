<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 200" role="img" aria-label="Graphique d'activité et pièces">
  <defs>
    <linearGradient id="barre" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.95"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0.55"/>
    </linearGradient>
    <linearGradient id="piece" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fec84b"/>
      <stop offset="1" stop-color="#f79009"/>
    </linearGradient>
  </defs>
  <!-- Panneau translucide -->
  <rect x="40" y="24" width="220" height="150" rx="16" fill="#ffffff" fill-opacity="0.12" stroke="#ffffff" stroke-opacity="0.25"/>
  <!-- Barres -->
  <rect x="68" y="112" width="22" height="44" rx="5" fill="url(#barre)"/>
  <rect x="102" y="92" width="22" height="64" rx="5" fill="url(#barre)"/>
  <rect x="136" y="100" width="22" height="56" rx="5" fill="url(#barre)"/>
  <rect x="170" y="70" width="22" height="86" rx="5" fill="url(#barre)"/>
  <rect x="204" y="52" width="22" height="104" rx="5" fill="#5eead4"/>
  <!-- Courbe -->
  <path d="M68 96 L113 78 L147 86 L181 58 L215 40" fill="none" stroke="#5eead4" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  <circle cx="215" cy="40" r="5" fill="#ffffff" stroke="#5eead4" stroke-width="3"/>
  <!-- Pièces -->
  <ellipse cx="270" cy="170" rx="30" ry="9" fill="#b54708" fill-opacity="0.5"/>
  <rect x="240" y="150" width="60" height="20" fill="url(#piece)"/>
  <ellipse cx="270" cy="150" rx="30" ry="9" fill="#fedf89"/>
  <ellipse cx="270" cy="150" rx="18" ry="5" fill="none" stroke="#f79009" stroke-width="2"/>
  <ellipse cx="282" cy="140" rx="30" ry="9" fill="#b54708" fill-opacity="0.5"/>
  <rect x="252" y="120" width="60" height="20" fill="url(#piece)"/>
  <ellipse cx="282" cy="120" rx="30" ry="9" fill="#fedf89"/>
  <text x="282" y="124.5" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="12" font-weight="700" fill="#b54708">€</text>
</svg>
